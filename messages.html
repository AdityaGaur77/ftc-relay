<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080b">
  <title>Messages — FTC Relay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="nav"></header>

  <main>
    <section class="page-head" style="padding-bottom:28px">
      <div class="wrap">
        <span class="eyebrow" data-reveal>Direct messages</span>
        <h1 data-split>Messages</h1>
      </div>
    </section>

    <div class="wrap">
      <div class="inbox" id="inbox">
        <div class="convo-list">
          <span class="lbl">Conversations</span>
          <div id="convos"></div>
          <div class="convo-new">
            <label class="lbl" for="newTo" style="display:block;margin-bottom:6px">Start a new one</label>
            <select id="newTo"><option value="">Pick a mentor…</option></select>
          </div>
        </div>
        <div class="chat" id="chat">
          <div class="chat-empty">Select a conversation.</div>
        </div>
      </div>
    </div>
  </main>

  <footer id="foot"></footer>

  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/messages.js"></script>
</body>
</html>
